<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 20%;
    }
    h1 {
      font-size: 2em;
    }
    button {
      padding: 10px 20px;
      font-size: 1.2em;
      margin: 10px;
      cursor: pointer;
    }
    #noBtn {
      position: absolute;
    }
  </style>
</head>
<body>
  <h1>Will you be my Valentine?</h1>
  <button onclick="alert('Yay! ❤️')">YES</button>
  <button id="noBtn">NO</button>

  <script>
    const noBtn = document.getElementById("noBtn");
    noBtn.style.left = "50%";
    noBtn.style.top = "60%";

    function moveButton() {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    // On mobile, use touchstart instead of hover
    noBtn.addEventListener("mouseenter", moveButton); // desktop hover
    noBtn.addEventListener("touchstart", moveButton); // mobile touch
  </script>
</body>
</html>
