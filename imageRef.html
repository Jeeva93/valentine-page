<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine Surprise</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #fff0f6;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .preview-link {
      display: block;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(200,60,100,0.13);
      overflow: hidden;
      transition: transform 0.15s;
    }
    .preview-link:active {
      transform: scale(0.97);
    }
    img {
      display: block;
      width: 90vw;
      max-width: 500px;
      height: auto;
      border-radius: 24px;
      border: 4px solid #ffb6d5;
    }
  </style>
</head>
<body>
  <a class="preview-link" href="https://jeeva93.github.io/valentine-page/" target="_blank">
    <img src="valentine-preview.svg" alt="Click Me ">
  </a>
</body>
</html>
