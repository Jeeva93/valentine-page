<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Your Valentine Link</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align:center; 
      padding:2rem; 
      background:#fff0f6;
    }
    input, button { 
      padding:0.6rem 1rem; 
      margin:0.5rem; 
      border-radius:8px; 
      border:1px solid #ccc; 
      font-size:1rem;
    }
    button { 
      background:#ff4d84; 
      color:white; 
      cursor:pointer; 
      border:none;
      box-shadow:0 4px 12px rgba(200,60,100,0.15);
    }
    #output { margin-top:1.5rem; font-size:1.1rem; }
    a { color:#ff4d84; font-weight:bold; text-decoration:none; }
    a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <h2>Generate Your Valentine Surprise Link</h2>
  <p>Type your loved one’s name below:</p>
  <input id="nameInput" type="text" placeholder="Enter name">
  <button onclick="generateLink()">Generate Link</button>
  
  <div id="output"></div>

  <script>
    function generateLink() {
      const name = document.getElementById("nameInput").value.trim();
      if(!name) {
        alert("Please enter a name!");
        return;
      }
      // Build the personalized link dynamically
      const link = `https://jeeva93.github.io/valentine-page/imageRef.html?name=${encodeURIComponent(name)}`;

      // Show it as a friendly hyperlink with copy + preview options
      document.getElementById("output").innerHTML = `
        Here’s your link:<br>
        <a href="${link}" target="_blank">Click here for your Valentine Surprise ❤️</a><br><br>
        <button onclick="navigator.clipboard.writeText('${link}')">Copy Link</button>
        <button onclick="window.open('${link}', '_blank')">Preview Link</button>
      `;
    }
  </script>
</body>
</html>
